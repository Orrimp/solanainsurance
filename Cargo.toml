[package]
name = "insurance"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-program = "2.3.0"
solana-system-interface = "3.0.0"
borsh = "1.0"
thiserror = "1.0"
arrayref = "0.3.7"
digest = "0.10.7"
blake3 = "1.5.1"

[build]
incremental = true

[lib]
crate-type = ["cdylib", "lib"]

[[ example ]]
name =  "client"
path =  "client/client.rs"

[dev-dependencies]
litesvm = "0.7.1"
solana-client = "2.3.0"
solana-sdk = "2.3.1"
anyhow = "1.0"

[features]
debug = []
